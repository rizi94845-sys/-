const $=id=>document.getElementById(id);function loadWrong(){try{return JSON.parse(localStorage.getItem('vocab688_wrong')||'{}')}catch(e){return {}}}function saveWrong(){localStorage.setItem('vocab688_wrong',JSON.stringify(wrongMap))}
function fmt(s){let m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}function elapsed(){return Math.floor((Date.now()-started)/1000)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function startTest(ids){pool=shuffle(ids.map(i=>WORDS[i-1])).sort((a,b)=>priority(b.id)-priority(a.id));if(!pool.length)return;index=0;sessionWrong=0;sessionDone=0;started=Date.now();$('setup').classList.add('hidden');$('wrongPage').classList.add('hidden');$('homeFoot').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('rangeLabel').textContent=ids.length===688?'全部 1—688':`编号 ${Math.min(...ids)}—${Math.max(...ids)}`;clearInterval(tick);tick=setInterval(()=>$('elapsed').textContent=fmt(elapsed()),1000);renderQuestion()}

let sortMode='freq';function showWrong(){ $('setup').classList.add('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('homeFoot').classList.add('hidden');$('wrongPage').classList.remove('hidden');renderWrong()}function hideWrong(){ $('wrongPage').classList.add('hidden');$('setup').classList.remove('hidden');$('homeFoot').classList.remove('hidden')}function renderWrong(){let entries=Object.entries(wrongMap).map(([id,r])=>({w:WORDS[+id-1],...r})).filter(x=>x.w);if(sortMode==='freq')entries.sort((a,b)=>b.count-a.count||b.last-a.last);else if(sortMode==='recent')entries.sort((a,b)=>b.last-a.last);else entries.sort((a,b)=>a.w.id-b.w.id);$('wrongTotal').textContent=entries.length+' 个单词';$('wrongList').innerHTML=entries.length?entries.map(x=>`<div class="wrongrow"><div><b>${x.w.word}</b> <span class="sub">[${x.w.ipa}] · #${x.w.id}</span><small>${x.w.meaning}</small></div><div class="count">错 ${x.count} 次</div></div>`).join(''):'<div class="empty">还没有错题，开始测试后错题会自动收集到这里。</div>';$('review').disabled=!entries.length}
